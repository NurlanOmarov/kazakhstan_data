# Доступ по https://IP:443 (без доменного имени), self-signed сертификат.
# Файл подключается внутри http{} (через conf.d/*.conf), поэтому
# limit_req_zone здесь корректен.

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# Скрываем версию nginx
server_tokens off;

# Лог без query-string — чтобы ПДн (ФИО/ИИН/телефон в GET) не попадали в логи.
log_format noqs '$remote_addr - [$time_local] "$request_method $uri" '
                '$status $body_bytes_sent';

# HTTP -> HTTPS
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve      X25519:secp384r1;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/access.log noqs;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://app:8000;
    }

    location / {
        proxy_pass http://app:8000;
    }
}
