services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      KZ_DB_PATH: /data/kazakhstan_data.db
      KZ_USERS_DB: /data/users.db
      KZ_SECURE_COOKIES: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./data:/data:rw                                        # users.db (rw) + аудит
      - ./data/kazakhstan_data.db:/data/kazakhstan_data.db:ro  # поверх: основная база только чтение
    expose:
      - "8000"
    # наружу напрямую не публикуем — только через nginx
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8443:443"              # доступ по https://IP:8443 (порт уникален, центральный nginx не трогаем)
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
